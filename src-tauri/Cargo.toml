[package]
name = "rustterm-tauri"
version = "0.1.2"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
portable-pty = "0.8"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["full", "process"] }
anyhow = "1"
keyring = "4.2.0"

# VNC 客户端（纯 Rust）
vnc-rs = "0.5"

# RDP 客户端（纯 Rust）
rdp = { package = "rdp-rs-2", version = "0.1.2" }

image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

capsaicin-client = { git = "https://github.com/calibrae/capsaicin", branch = "main" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
rdp-rs-2 = { path = "../../rdp-rs-2-patched" }
