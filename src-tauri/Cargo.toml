[package]
name = "rustterm-tauri"
version = "0.1.3"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
portable-pty = "0.8"
aws-lc-rs = { version = "1", features = ["prebuilt-nasm"] }

# SSH：vendor 版本，和 ironrdp 的 rc 依赖对齐
russh = { path = "../vendor/russh/russh", features = ["des", "flate2", "ring", "rsa"] }
russh-sftp = { path = "../vendor/russh-sftp" }

tokio = { version = "1", features = ["full", "process"] }
anyhow = "1"
keyring = "4.2.0"
rand = "0.8"

# VNC：vendor 版本
vnc-rs = { path = "../vendor/vnc-rs" }

# RDP：vendor 的 ironrdp
ironrdp = { path = "../vendor/ironrdp/crates/ironrdp", default-features = false, features = [
    "client", "client-clipboard", "cliprdr", "connector", "core", "input", "pdu"
] }
smallvec = "1"
arboard = { version = "3", features = ["wayland-data-control"] }
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
x509-cert = { version = "0.2", default-features = false, features = ["pem"] }
tracing = "0.1"

# 避免 libz-sys 编译 C：把 rust_backend 作为直接依赖
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

capsaicin-client = { path = "../vendor/capsaicin/crates/capsaicin-client" }

reqwest = { version = "0.12", features = ["json"] }

[target.'cfg(not(windows))'.dependencies]
ironrdp = { path = "../vendor/ironrdp/crates/ironrdp", default-features = false, features = [
    "client", "client-clipboard", "cliprdr", "connector", "core", "input", "pdu", "rustls"
] }

[target.'cfg(windows)'.dependencies]
ironrdp = { path = "../vendor/ironrdp/crates/ironrdp", default-features = false, features = [
    "client", "client-clipboard", "cliprdr", "connector", "core", "input", "pdu", "native-tls"
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[patch.crates-io]
picky = { path = "../vendor/picky" }
sspi = { path = "../vendor/sspi" }
