[package]
name = "rustterm-tauri"
version = "0.1.0"
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
directories = "5"
portable-pty = "0.8"
russh = { version = "0.63", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
tokio = { version = "1", features = ["full", "process"] }
anyhow = "1"
keyring = "4.2.0"
# VNC 客户端（纯 Rust）
vnc-rs = "0.5"

# RDP 客户端（纯 Rust）
ironrdp = { version = "0.11", features = ["client", "graphics"] }
ironrdp-tokio = "0.11"
ironrdp-session = "0.11"
ironrdp-graphics = "0.11"

# 图像编码（用于压缩帧数据）
image = { version = "0.25", default-features = false, features = ["jpeg"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
